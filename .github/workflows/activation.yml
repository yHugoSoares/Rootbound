name: Activation

# Option A: generate a Unity activation request file (.alf), then exchange it for
# a .ulf at https://license.unity3d.com/manual and store it as the UNITY_LICENSE
# repository secret. Run this workflow manually once.
on:
  workflow_dispatch:

jobs:
  request-activation-file:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.84f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual-Activation-File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          if-no-files-found: error
