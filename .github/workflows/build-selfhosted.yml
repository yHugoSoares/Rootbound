name: Build (self-hosted)

# Runs on a self-hosted macOS runner that has the pinned Unity editor installed
# and licensed, which avoids Unity license secrets entirely.
#
# Setup:
#   1. Register the machine as a GitHub Actions runner with the labels
#      `self-hosted` and `macOS` (repo Settings > Actions > Runners).
#   2. Install Unity 6000.0.84f1 with Mac + Windows build support.
#   3. Optional: set the PHOTON_APP_ID repository secret so builds can play
#      online; without it they are offline / local co-op only.
#   4. If the editor is not in the default location, set the UNITY_PATH
#      repository variable to its path.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneOSX
            label: macOS
          - target: StandaloneWindows64
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Build
        env:
          DUATBORN_BUILD_TARGET: ${{ matrix.target }}
          PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
          UNITY_PATH: ${{ vars.UNITY_PATH }}
        run: |
          UNITY="${UNITY_PATH:-/Applications/Unity/Hub/Editor/6000.0.84f1/Unity.app/Contents/MacOS/Unity}"
          if [ ! -x "$UNITY" ]; then
            echo "::error::Unity editor not found at $UNITY (set UNITY_PATH)."
            exit 1
          fi
          "$UNITY" -batchmode -nographics -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod Duatborn.EditorTools.DuatbornBuild.PerformBuild \
            -logFile -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duatborn-${{ matrix.label }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    needs: build
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package archives
        run: |
          if [ ! -d artifacts ]; then
            echo "::error::No artifacts were downloaded; refusing to publish an empty release."
            exit 1
          fi
          cd artifacts
          shopt -s nullglob
          dirs=(*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::Artifacts directory is empty; refusing to publish an empty release."
            exit 1
          fi
          for d in "${dirs[@]}"; do
            name="${d%/}"
            zip -r "${name}-${{ github.ref_name }}.zip" "$name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
