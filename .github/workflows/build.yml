name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `secrets` context is not allowed in a job-level `if`, so license
  # presence is resolved in a preflight job and exposed as an output.
  license:
    name: Check Unity license
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check Unity license
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Unity license secrets configured; skipping build and release. See docs/HANDOFF.md (CI)."
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: license
    if: needs.license.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneOSX
            label: macOS
          - target: StandaloneWindows64
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          # Required for a repository build. Set ONE of:
          #   UNITY_LICENSE  (contents of the .ulf license file)
          # or UNITY_EMAIL + UNITY_PASSWORD (+ UNITY_SERIAL for Pro).
          # Never commit these; configure them as repository secrets.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.84f1
          targetPlatform: ${{ matrix.target }}
          # Custom method so the Fusion App ID can be injected before building.
          # game-ci does not forward workflow `env` into the build container, so
          # values are passed as customParameters instead.
          buildMethod: Rootbound.EditorTools.RootboundBuild.PerformBuild
          customParameters: -duatbornTarget ${{ matrix.target }}${{ secrets.PHOTON_APP_ID != '' && format(' -photonAppId {0}', secrets.PHOTON_APP_ID) || '' }}
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duatborn-${{ matrix.label }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.license.outputs.configured == 'true' && needs.build.result == 'success' }}
    needs: [license, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package archives
        run: |
          if [ ! -d artifacts ]; then
            echo "::error::No artifacts were downloaded; refusing to publish an empty release."
            exit 1
          fi
          cd artifacts
          shopt -s nullglob
          dirs=(*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::Artifacts directory is empty; refusing to publish an empty release."
            exit 1
          fi
          for d in "${dirs[@]}"; do
            name="${d%/}"
            zip -r "${name}-${{ github.ref_name }}.zip" "$name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
