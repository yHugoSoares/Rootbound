name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneOSX
            label: macOS
          - target: StandaloneWindows64
            label: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      # The `secrets` context is not allowed in a job-level `if`, so the license
      # presence is checked in a step and exposed as an output.
      - name: Check Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Unity license secrets configured; skipping build. See docs/HANDOFF.md (CI)."
          fi

      - name: Cache Library
        if: steps.license.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Build
        if: steps.license.outputs.configured == 'true'
        uses: game-ci/unity-builder@v4
        env:
          # Required for a repository build. Set ONE of:
          #   UNITY_LICENSE  (contents of the .ulf license file)
          # or UNITY_EMAIL + UNITY_PASSWORD (+ UNITY_SERIAL for Pro).
          # Never commit these; configure them as repository secrets.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.84f1
          targetPlatform: ${{ matrix.target }}
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload artifact
        if: steps.license.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Duatborn-${{ matrix.label }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package archives
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "${name}-${{ github.ref_name }}.zip" "$name"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
